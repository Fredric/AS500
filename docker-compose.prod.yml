services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: as500
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: as500
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U as500"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      network: host
    ports:
      # Bind to loopback only — Caddy terminates TLS and proxies the site here.
      # A public bind would let clients bypass TLS and talk plaintext HTTP.
      - "127.0.0.1:3001:3001"
      # Remote MCP server. Bind to 127.0.0.1 only — Caddy terminates TLS on
      # the host and reverse-proxies /mcp/* to this port.
      - "127.0.0.1:3002:3002"
      # Virtual office backend (HTTP + WebSocket). Bind to 127.0.0.1 only —
      # Caddy terminates TLS and reverse-proxies /world/* to this port. The
      # browser never addresses this port directly (unlike the dev compose
      # file, where it's published straight to the host for curl-testing);
      # see client/src/world/useWorldSocket.ts.
      - "127.0.0.1:3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      # REQUIRED: persistent HS256 secret for MCP access tokens. Must be
      # >=32 chars. If unset, every restart invalidates every agent's token.
      AS500_MCP_JWT_SECRET: ${AS500_MCP_JWT_SECRET}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL}
      # AI agent integration (optional — chat panel silently errors if unset)
      AI_AGENT_BASE_URL: ${AI_AGENT_BASE_URL}
      AI_AGENT_API_KEY: ${AI_AGENT_API_KEY}
      AI_AGENT_MODEL: ${AI_AGENT_MODEL:-as500-agent}
      # as500-docs RAG service (started separately from the as500-docs repo)
      DOCS_API_URL: ${DOCS_API_URL}
      DOCS_MIN_SCORE: ${DOCS_MIN_SCORE:-0.25}
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
    driver_opts:
      # Pin the bridge name so nftables rules survive Docker network recreations
      com.docker.network.bridge.name: as500-docker-br
