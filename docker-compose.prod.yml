services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: as500
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: as500
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U as500"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      network: host
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    restart: unless-stopped

volumes:
  postgres_data:
