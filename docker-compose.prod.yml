services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: as500
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: as500
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U as500"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      network: host
    ports:
      - "3001:3001"
      # Remote MCP server. Bind to 127.0.0.1 only — Caddy terminates TLS on
      # the host and reverse-proxies /mcp/* to this port.
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      # REQUIRED: persistent HS256 secret for MCP access tokens. Must be
      # >=32 chars. If unset, every restart invalidates every agent's token.
      AS500_MCP_JWT_SECRET: ${AS500_MCP_JWT_SECRET}
    restart: unless-stopped

volumes:
  postgres_data:
