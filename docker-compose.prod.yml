services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: as500
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: as500
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U as500"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      network: host
    ports:
      - "3001:3001"
      # Remote MCP server. Bind to 127.0.0.1 only — Caddy terminates TLS on
      # the host and reverse-proxies /mcp/* to this port.
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      # REQUIRED: persistent HS256 secret for MCP access tokens. Must be
      # >=32 chars. If unset, every restart invalidates every agent's token.
      AS500_MCP_JWT_SECRET: ${AS500_MCP_JWT_SECRET}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL}
      # AI agent integration (optional — chat panel silently errors if unset)
      AI_AGENT_BASE_URL: ${AI_AGENT_BASE_URL}
      AI_AGENT_API_KEY: ${AI_AGENT_API_KEY}
      AI_AGENT_MODEL: ${AI_AGENT_MODEL:-as500-agent}
      # as500-docs RAG service
      DOCS_API_URL: ${DOCS_API_URL}
      DOCS_MIN_SCORE: ${DOCS_MIN_SCORE:-0.25}
    restart: unless-stopped

  docs:
    build:
      context: /var/www/as500-docs
      network: host
    # Not exposed externally — only reachable within the compose network as "docs:8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Uses the shared postgres container — asyncpg driver for async SQLAlchemy
      DATABASE_URL: ${DOCS_DATABASE_URL}
      STORAGE_ROOT: /app/storage
      # Embeddings via Ollama on the dev machine over WireGuard VPN
      EMBEDDING_BACKEND: ollama
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      # Ingestion disabled in production (happens locally, data is pushed)
      USE_VLM: "false"
      TRANSLATE_TO: ""
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Bind-mount the shared storage so images ingested locally are available
      - /var/www/AS500/storage:/app/storage
    # Run alembic migrations then start the API server
    command: >
      sh -c "alembic upgrade head && uvicorn as500_docs.api.main:app --host 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
    driver_opts:
      # Pin the bridge name so nftables rules survive Docker network recreations
      com.docker.network.bridge.name: as500-docker-br
