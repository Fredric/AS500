services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: as500
      POSTGRES_PASSWORD: as500
      POSTGRES_DB: as500
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U as500" ]
      interval: 5s
      retries: 5

  server:
    image: node:20-bullseye
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      # Ingest monitor: read container status and stream logs via the Docker
      # Engine API. Without this the dashboard falls back to HTTP-only probes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Ingest monitor: as500-agent runs natively on the host and redirects its
      # stderr to a file, so the log dir is mounted read-only to surface it.
      - ../as500-agent:/host/as500-agent:ro
      # Ingest monitor: the document inspector renders the page images Docling
      # extracted, which as500-docs writes into its own storage/ tree.
      - ../as500-docs/storage:/host/docs-storage:ro
    command: sh -c "touch .env.local && npm ci && npm run dev"
    ports:
      - "3001:3001"
      # Remote MCP server (OAuth 2.1 + /mcp). Booted in-process by src/index.ts
      # when MCP_ENABLED is not 'false'. Published on the same port on the host
      # so Claude Code / other MCP clients can connect to http://localhost:3002/mcp.
      - "3002:3002"
      # Ingest monitor dashboard backend (HTTP + WebSocket). Consumed by the
      # /ingestmonitor page. See server/src/monitor/. Bound to loopback only:
      # it exposes raw service logs and has no auth unless MONITOR_TOKEN is set.
      - "127.0.0.1:3005:3005"
      # Virtual office backend (HTTP + WebSocket). Consumed by the /office page,
      # which connects straight to this port from the browser. See
      # server/src/world/. Published like 3002 rather than loopback-only: every
      # route requires a valid AS500 access token, unlike the ingest monitor.
      - "3006:3006"
    extra_hosts:
      # Ingest monitor probes Ollama, vLLM and as500-agent, all of which run
      # natively on the host rather than in this Compose project.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://as500:as500@postgres:5432/as500
      # Ingest monitor probe targets (host-native services).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      VLM_API_URL: http://host.docker.internal:8000/v1
      # as500-docs ingest API — triggers Docling pipeline when a PDF/image is uploaded.
      # Uses host.docker.internal because as500-docs is on a separate Docker network.
      DOCS_API_URL: http://host.docker.internal:8080
      # Stable JWT secret so MCP access tokens survive `docker-compose restart`.
      # In dev this is fine committed; override in prod via env / secret manager.
      AS500_MCP_JWT_SECRET: dev-secret-do-not-use-in-prod-at-least-32-chars
      # Public URL advertised in OAuth metadata — must match what MCP clients see.
      # Caddy (caddy-dev service) terminates TLS at https://localhost:3443 and
      # proxies to this container:3002.  Comment out to use plain http://localhost:3002.
      MCP_PUBLIC_URL: https://localhost:3443

  # Local HTTPS terminator for the MCP server.  Caddy listens on 3443 (HTTPS)
  # and reverse-proxies to server:3002 using mkcert-signed certs from ./certs/.
  # Run `mkcert -cert-file certs/local.pem -key-file certs/local-key.pem localhost 127.0.0.1`
  # on the host once to generate the certs (and `mkcert -install` to trust the CA).
  caddy-dev:
    image: caddy:2-alpine
    ports:
      - "3443:3443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    depends_on:
      - server

  client:
    image: node:20-bullseye
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      VITE_DEV_API_TARGET: http://server:3001
      # server:3006 — Docker's internal service DNS, not localhost: the client
      # and server run in separate containers, so 127.0.0.1 from inside the
      # client container is the client container itself, not the server.
      VITE_DEV_WORLD_TARGET: http://server:3006

volumes:
  postgres_data:
  client_node_modules:
  server_node_modules:
  caddy_dev_data:
  caddy_dev_config:
