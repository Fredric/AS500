services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: as500
      POSTGRES_PASSWORD: as500
      POSTGRES_DB: as500
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U as500" ]
      interval: 5s
      retries: 5

  server:
    image: node:20-bullseye
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "touch .env.local && npm ci && npm run dev"
    ports:
      - "3001:3001"
      # Remote MCP server (OAuth 2.1 + /mcp). Booted in-process by src/index.ts
      # when MCP_ENABLED is not 'false'. Published on the same port on the host
      # so Claude Code / other MCP clients can connect to http://localhost:3002/mcp.
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://as500:as500@postgres:5432/as500
      # Stable JWT secret so MCP access tokens survive `docker-compose restart`.
      # In dev this is fine committed; override in prod via env / secret manager.
      AS500_MCP_JWT_SECRET: dev-secret-do-not-use-in-prod-at-least-32-chars

  client:
    image: node:20-bullseye
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
  client_node_modules:
  server_node_modules:
