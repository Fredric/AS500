# Use this to run server + client locally against Heroku Postgres instead of local Docker Postgres.
#
# Usage:
#   1. Get your Heroku DATABASE_URL:
#        heroku config:get DATABASE_URL -a YOUR_APP_NAME
#   2. Run:
#        DATABASE_URL='postgres://...' docker-compose -f docker-compose.heroku-db.yml up
#
#   Or add DATABASE_URL to a .env file (gitignored) and run:
#        docker-compose -f docker-compose.heroku-db.yml up
#
# No local Postgres container is started; server connects to Heroku.

services:
  server:
    image: node:20-bullseye
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # No depends_on postgres – we use Heroku DB

  client:
    image: node:20-bullseye
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  client_node_modules:
  server_node_modules:
